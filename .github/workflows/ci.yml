name: HTML-first candidate
on:
  push:
  pull_request:
jobs:
  verify:
    # H02 real disk and H04 independent PDFKit checks require macOS.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chrome
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm package:pack
      - run: pnpm release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-candidate-evidence
          path: artifacts/
