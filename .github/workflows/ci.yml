name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm validate
      - run: pnpm e2e:vertical-slice
      - run: pnpm e2e:milestone
      - run: pnpm e2e:beta
      - run: pnpm e2e:ga-a
