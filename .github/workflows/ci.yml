name: HTML-first candidate
on:
  push:
  pull_request:
jobs:
  verify:
    # Frozen PDFKit evidence uses Darwin 25 (macOS 26); older parsers differ.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          # Contract tests replay committed acceptance/decision evidence.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chrome
      - run: pnpm exec playwright install chromium --only-shell
      - run: python3 -m pip install -r scripts/u04/requirements.txt
      - run: pnpm typecheck
      - run: pnpm build
      # 2026-10-01 user approval: Chrome scope; waive only this exact native Safari journey (not passed).
      # Keep Safari harness/unit coverage and every Chrome assertion in the full suite.
      # Per-command NODE_OPTIONS; disable pnpm dependency verification to avoid install/purge.
      - run: |-
          NODE_OPTIONS='--test-skip-pattern="^H02 acceptance 5: Safari actual WebDriver journey or explicit blocked evidence [(]not simulated Safari[)]$"' pnpm --config.verify-deps-before-run=false test
      - run: pnpm package:pack
      # release:check repeats the full suite; use the same exact approved Safari waiver here.
      - run: |-
          NODE_OPTIONS='--test-skip-pattern="^H02 acceptance 5: Safari actual WebDriver journey or explicit blocked evidence [(]not simulated Safari[)]$"' pnpm --config.verify-deps-before-run=false release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-candidate-evidence
          path: artifacts/
