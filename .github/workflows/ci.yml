name: HTML-first candidate
on:
  push:
  pull_request:
jobs:
  verify:
    # Frozen PDFKit evidence uses Darwin 25 (macOS 26); older parsers differ.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          # Contract tests replay committed acceptance/decision evidence.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chrome
      - run: pnpm exec playwright install chromium --only-shell
      - run: python3 -m pip install -r scripts/u04/requirements.txt
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm package:pack
      - run: pnpm release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-candidate-evidence
          path: artifacts/
