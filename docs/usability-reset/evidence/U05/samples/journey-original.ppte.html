&lt;section class="page" data-ppte-slide="ppte-28" data-ppte-id="ppte-28"&gt;&lt;header class="mast" data-ppte-id="ppte-29"&gt;&lt;span class="brand" data-ppte-id="ppte-30"&gt;CHERRY STUDIO&lt;/span&gt;&lt;span class="issue" data-ppte-id="ppte-31"&gt;工具 / 先理解它的位置&lt;/span&gt;&lt;/header&gt;&lt;main class="chapter" data-ppte-id="ppte-32"&gt;&lt;p class="kicker" data-ppte-id="ppte-33"&gt;01 / 选择自己的工具&lt;/p&gt;&lt;h2 data-ppte-id="ppte-34"&gt;一个桌面入口，连接多种模型。&lt;/h2&gt;&lt;p class="wide-lead" data-ppte-id="ppte-35"&gt;Cherry Studio 是支持多家大语言模型提供商的桌面客户端，&lt;br data-ppte-id="ppte-36"&gt;可运行于 Windows、macOS 与 Linux。&lt;/p&gt;&lt;div class="two-notes" data-ppte-id="ppte-37"&gt;&lt;div class="note-block" data-ppte-id="ppte-38"&gt;&lt;h3 data-ppte-id="ppte-39"&gt;连接模型&lt;/h3&gt;&lt;p data-ppte-id="ppte-40"&gt;固定版本资料列出云端服务接入，&lt;br data-ppte-id="ppte-41"&gt;也列出 Ollama、LM Studio 本地模型支持。&lt;/p&gt;&lt;/div&gt;&lt;div class="note-block" data-ppte-id="ppte-42"&gt;&lt;h3 data-ppte-id="ppte-43"&gt;组织使用&lt;/h3&gt;&lt;p data-ppte-id="ppte-44"&gt;围绕助手、对话与主题管理组织工作，&lt;br data-ppte-id="ppte-45"&gt;把模型能力带入具体的使用场景。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer class="folio" data-ppte-id="ppte-46"&gt;&lt;span data-ppte-id="ppte-47"&gt;来源：CherryHQ/cherry-studio · README · 固定版本 67ca175 / Introduction、Key Features&lt;/span&gt;&lt;span data-ppte-id="ppte-48"&gt;02 / 09&lt;/span&gt;&lt;/footer&gt;&lt;/section&gt;
&lt;section class="page" data-ppte-slide="ppte-49" data-ppte-id="ppte-49"&gt;&lt;header class="mast" data-ppte-id="ppte-50"&gt;&lt;span class="brand" data-ppte-id="ppte-51"&gt;CHERRY STUDIO&lt;/span&gt;&lt;span class="issue" data-ppte-id="ppte-52"&gt;开放 / 使用经验也是起点&lt;/span&gt;&lt;/header&gt;&lt;main class="statement" data-ppte-id="ppte-53"&gt;&lt;div data-ppte-id="ppte-54"&gt;&lt;p class="kicker" data-ppte-id="ppte-55"&gt;从个人体验出发&lt;/p&gt;&lt;h2 data-ppte-id="ppte-56"&gt;先用起来。&lt;br data-ppte-id="ppte-57"&gt;再说清楚。&lt;/h2&gt;&lt;/div&gt;&lt;div data-ppte-id="ppte-58"&gt;&lt;p class="large-copy" data-ppte-id="ppte-59"&gt;你在使用中遇到的一个障碍，&lt;br data-ppte-id="ppte-60"&gt;可能就是参与的起点。&lt;/p&gt;&lt;p class="body-copy" data-ppte-id="ppte-61"&gt;先说明自己想完成什么，再记录哪里受阻。&lt;br data-ppte-id="ppte-62"&gt;把“感觉不好用”转成可以讨论的具体场景，&lt;br data-ppte-id="ppte-63"&gt;让其他人理解问题，也让改进有据可循。&lt;/p&gt;&lt;p class="small-note" data-ppte-id="ppte-64"&gt;这是一种参与思路，并非官方处理时限或采纳承诺。&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer class="folio" data-ppte-id="ppte-65"&gt;&lt;span data-ppte-id="ppte-66"&gt;作者参与建议 · 具体要求以项目贡献指南为准&lt;/span&gt;&lt;span data-ppte-id="ppte-67"&gt;03 / 09&lt;/span&gt;&lt;/footer&gt;&lt;/section&gt;
&lt;section class="page" data-ppte-slide="ppte-68" data-ppte-id="ppte-68"&gt;&lt;header class="mast" data-ppte-id="ppte-69"&gt;&lt;span class="brand" data-ppte-id="ppte-70"&gt;CHERRY STUDIO&lt;/span&gt;&lt;span class="issue" data-ppte-id="ppte-71"&gt;参与 / 多条路径，同一方向&lt;/span&gt;&lt;/header&gt;&lt;main class="split-body" data-ppte-id="ppte-72"&gt;&lt;div data-ppte-id="ppte-73"&gt;&lt;p class="kicker" data-ppte-id="ppte-74"&gt;从使用者到共建者&lt;/p&gt;&lt;h2 data-ppte-id="ppte-75"&gt;写代码，&lt;br data-ppte-id="ppte-76"&gt;只是其中一条路。&lt;/h2&gt;&lt;p class="body-copy" data-ppte-id="ppte-77"&gt;项目也欢迎设计讨论、文档维护、问题管理与社区答疑。&lt;br data-ppte-id="ppte-78"&gt;从自己的经验出发，就能找到一个具体的切入点。&lt;/p&gt;&lt;p class="small-note" data-ppte-id="ppte-79"&gt;这里呈现的是参与关系，&lt;br data-ppte-id="ppte-80"&gt;并非项目实际开发流程或贡献统计。&lt;/p&gt;&lt;/div&gt;&lt;figure data-ppte-id="ppte-81"&gt;&lt;div class="diagram-labels" data-ppte-id="ppte-82"&gt;&lt;span data-ppte-id="ppte-83"&gt;反馈&lt;/span&gt;&lt;span data-ppte-id="ppte-84"&gt;代码&lt;/span&gt;&lt;span data-ppte-id="ppte-85"&gt;文档&lt;/span&gt;&lt;/div&gt;&lt;img class="diagram-image" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NDAiIGhlaWdodD0iNDQwIiB2aWV3Qm94PSIwIDAgNjQwIDQ0MCIgZmlsbD0ibm9uZSI+Cjx0aXRsZT7kuI3lkIzotKHnjK7msYflhaXlhbHlkIznu7TmiqTnmoTkuLvnur88L3RpdGxlPgo8cmVjdCB3aWR0aD0iNjQwIiBoZWlnaHQ9IjQ0MCIgZmlsbD0iI2VlZWFlMiIvPgo8ZyBzdHJva2U9IiNkM2NlYzUiIHN0cm9rZS13aWR0aD0iMSI+PHBhdGggZD0iTTYwIDgwSDU4ME02MCAxNjBINTgwTTYwIDI0MEg1ODBNNjAgMzIwSDU4ME02MCA0MDBINTgwIi8+PC9nPgo8ZyBzdHJva2Utd2lkdGg9IjEyIiBzdHJva2UtbGluZWNhcD0icm91bmQiPjxwYXRoIGQ9Ik0xMDQgNjJWMTQ2QzEwNCAyMTcgMzIwIDE4MSAzMjAgMjgwVjM4NiIgc3Ryb2tlPSIjYjg0OTMwIi8+PHBhdGggZD0iTTMyMCA2MlYzODYiIHN0cm9rZT0iIzI0MmMyZSIvPjxwYXRoIGQ9Ik01MzYgNjJWMTQ2QzUzNiAyMTcgMzIwIDE4MSAzMjAgMjgwIiBzdHJva2U9IiM3ZDg4ODQiLz48L2c+CjxnIGZpbGw9IiNmOGY2ZjAiIHN0cm9rZS13aWR0aD0iNSI+PGNpcmNsZSBjeD0iMTA0IiBjeT0iODIiIHI9IjE4IiBzdHJva2U9IiNiODQ5MzAiLz48Y2lyY2xlIGN4PSIzMjAiIGN5PSI4MiIgcj0iMTgiIHN0cm9rZT0 &lt;section class="page" data-ppte-slide="ppte-93" data-ppte-id="ppte-93"&gt;&lt;header class="mast" data-ppte-id="ppte-94"&gt;&lt;span class="brand" data-ppte-id="ppte-95"&gt;CHERRY STUDIO&lt;/span&gt;&lt;span class="issue" data-ppte-id="ppte-96"&gt;反馈 / 把体验变成可讨论的信息&lt;/span&gt;&lt;/header&gt;&lt;main class="example" data-ppte-id="ppte-97"&gt;&lt;div data-ppte-id="ppte-98"&gt;&lt;p class="kicker" data-ppte-id="ppte-99"&gt;让别人能重走你的路径&lt;/p&gt;&lt;h2 data-ppte-id="ppte-100"&gt;一份反馈，&lt;br data-ppte-id="ppte-101"&gt;先把问题讲清。&lt;/h2&gt;&lt;p class="body-copy" data-ppte-id="ppte-102"&gt;不用先知道修复答案。&lt;br data-ppte-id="ppte-103"&gt;清楚的上下文，已经能减少来回追问。&lt;/p&gt;&lt;p class="small-note" data-ppte-id="ppte-104"&gt;右侧为虚构写作示例，&lt;br data-ppte-id="ppte-105"&gt;不代表已发现的产品缺陷。&lt;/p&gt;&lt;/div&gt;&lt;div class="example-panel" data-ppte-id="ppte-106"&gt;&lt;p class="kicker" data-ppte-id="ppte-107"&gt;反馈写作示例 · 非真实缺陷&lt;/p&gt;&lt;h3 data-ppte-id="ppte-108"&gt;某个操作后，结果与预期不同&lt;/h3&gt;&lt;dl data-ppte-id="ppte-109"&gt;&lt;dt data-ppte-id="ppte-110"&gt;场景与步骤&lt;/dt&gt;&lt;dd data-ppte-id="ppte-111"&gt;我想完成什么？从哪个页面开始？&lt;br data-ppte-id="ppte-112"&gt;按顺序列出触发问题的操作。&lt;/dd&gt;&lt;dt data-ppte-id="ppte-113"&gt;预期与实际&lt;/dt&gt;&lt;dd data-ppte-id="ppte-114"&gt;我以为会出现什么？实际出现了什么？&lt;br data-ppte-id="ppte-115"&gt;补充可以帮助定位的环境与版本。&lt;/dd&gt;&lt;dt data-ppte-id="ppte-116"&gt;可复现的边界&lt;/dt&gt;&lt;dd data-ppte-id="ppte-117"&gt;每次都出现，还是偶尔发生？&lt;br data-ppte-id="ppte-118"&gt;如需附素材，先去除其中的私人信息。&lt;/dd&gt;&lt;/dl&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer class="folio" data-ppte-id="ppte-119"&gt;&lt;span data-ppte-id="ppte-120"&gt;作者参与建议 · 具体要求以项目贡献指南为准&lt;/span&gt;&lt;span data-ppte-id="ppte-121"&gt;05 / 09&lt;/span&gt;&lt;/footer&gt;&lt;/section&gt;
&lt;section class="page" data-ppte-slide="ppte-122" data-ppte-id="ppte-122"&gt;&lt;header class="mast" data-ppte-id="ppte-123"&gt;&lt;span class="brand" data-ppte-id="ppte-124"&gt;CHERRY STUDIO&lt;/span&gt;&lt;span class="issue" data-ppte-id="ppte-125"&gt;协作 / 让一次修改容易理解&lt;/span&gt;&lt;/header&gt;&lt;main class="chapter" data-ppte-id="ppte-126"&gt;&lt;p class="kicker" data-ppte-id="ppte-127"&gt;把改动交给共同维护&lt;/p&gt;&lt;h2 data-ppte-id="ppte-128"&gt;从独立分支，到一个清楚的 PR。&lt;/h2&gt;&lt;ol class="steps" data-ppte-id="ppte-129"&gt;&lt;li data-ppte-id="ppte-130"&gt;&lt;span class="num" data-ppte-id="ppte-131"&gt;01&lt;/span&gt;&lt;div data-ppte-id="ppte-132"&gt;&lt;h3 data-ppte-id="ppte-133"&gt;Fork 与克隆&lt;/h3&gt;&lt;p data-ppte-id="ppte-134"&gt;建立自己的工作副本，&lt;br data-ppte-id="ppte-135"&gt;先阅读贡献指南与分支策略。&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li data-ppte-id="ppte-136"&gt;&lt;span class="num" data-ppte-id="ppte-137"&gt;02&lt;/span&gt;&lt;div data-ppte-id="ppte-138"&gt;&lt;h3 data-ppte-id="ppte-139"&gt;创建分支&lt;/h3&gt;&lt;p data-ppte-id="ppte-140"&gt;围绕一个明确的问题组织改动，&lt;br data-ppte-id="ppte-141"&gt;保持范围便于解释与审阅。&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li data-ppte-id="ppte-142"&gt;&lt;span class="num" data-ppte-id="ppte-143"&gt;03&lt;/span&gt;&lt;div data-ppte-id="ppte-144"&gt;&lt;h3 data-ppte-id="ppte-145"&gt;提交修改&lt;/h3&gt;&lt;p data-ppte-id="ppte-146"&gt;完成修改并提交、推送，&lt;br data-ppte-id="ppte-147"&gt;交代做了什么以及如何验证。&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li data-ppte-id="ppte-148"&gt;&lt;span class="num" data-ppte-id="ppte-149"&gt;04&lt;/span&gt;&lt;div data-ppte-id="ppte-150"&gt;&lt;h3 data-ppte-id="ppte-151"&gt;发起 Pull Request&lt;/h3&gt;&lt;p data-ppte-id="ppte-152"&gt;说明修改的原因，&lt;br data-ppte-id="ppte-153"&gt;跟进讨论并补充必要的信息。&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/main&gt;&lt;footer class="folio" data-ppte-id="ppte-154"&gt;&lt;span data-ppte-id="ppte-155"&gt;来源：CherryHQ/cherry-studio · README · 固定版本 67ca175 / Getting Started；范围与验证为作者建议&lt;/span&gt;&lt;span data-ppte-id="ppte-156"&gt;06 / 09&lt;/span&gt;&lt;/footer&gt;&lt;/section&gt;
&lt;section class="page" data-ppte-slide="ppte-157" data-ppte-id="ppte-157"&gt;&lt;header class="mast" data-ppte-id="ppte-158"&gt;&lt;span class="brand" data-ppte-id="ppte-159"&gt;CHERRY STUDIO&lt;/span&gt;&lt;span class="issue" data-ppte-id="ppte-160"&gt;行动 / 一次小而完整的贡献&lt;/span&gt;&lt;/header&gt;&lt;main class="dense-body" data-ppte-id="ppte-161"&gt;&lt;div class="dense-heading" data-ppte-id="ppte-162"&gt;&lt;div data-ppte-id="ppte-163"&gt;&lt;p class="kicker" data-ppte-id="ppte-164"&gt;把参与变成可执行的下一步&lt;/p&gt;&lt;h2 data-ppte-id="ppte-165"&gt;从你最了解的那个问题开始。&lt;/h2&gt;&lt;/div&gt;&lt;p data-ppte-id="ppte-166"&gt;下列是作者的参与建议，&lt;br data-ppte-id="ppte-167"&gt;具体要求以项目贡献指南为准。&lt;/p&gt;&lt;/div&gt;&lt;table class="contribution-table" data-ppte-id="ppte-168"&gt;&lt;thead data-ppte-id="ppte-169"&gt;&lt;tr data-ppte-id="ppte-170"&gt;&lt;th scope="col" data-ppte-id="ppte-171"&gt;你看到的机会&lt;/th&gt;&lt;th scope="col" data-ppte-id="ppte-172"&gt;可以做的一件事&lt;/th&gt;&lt;th scope="col" data-ppte-id="ppte-173"&gt;让协作者容易接手&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody data-ppte-id="ppte-174"&gt;&lt;tr data-ppte-id="ppte-175"&gt;&lt;td data-ppte-id="ppte-176"&gt;&lt;span class="row-num" data-ppte-id="ppte-177"&gt;01&lt;/span&gt;使用中遇到障碍&lt;/td&gt;&lt;td data-ppte-id="ppte-178"&gt;把问题整理为可复现的反馈&lt;/td&gt;&lt;td data-ppte-id="ppte-179"&gt;写明操作步骤、预期与实际结果&lt;/td&gt;&lt;/tr&gt;&lt;tr data-ppte-id="ppte-180"&gt;&lt;td data-ppte-id="ppte-181"&gt;&lt;span class="row-num" data-ppte-id="ppte-182"&gt;02&lt;/span&gt;说明不够清楚&lt;/td&gt;&lt;td data-ppte-id="ppte-183"&gt;补充一段文档或一个具体例子&lt;/td&gt;&lt;td data-ppte-id="ppte-184"&gt;说明适用场景，核对步骤是否可用&lt;/td&gt;&lt;/tr&gt;&lt;tr data-ppte-id="ppte-185"&gt;&lt;td data-ppte-id="ppte-186"&gt;&lt;span class="row-num" data-ppte-id="ppte-187"&gt;03&lt;/span&gt;交互可以更顺&lt;/td&gt;&lt;td data-ppte-id="ppte-188"&gt;在设计讨论中提出改进方案&lt;/td&gt;&lt;td data-ppte-id="ppte-189"&gt;带上使用场景，解释取舍与影响&lt;/td&gt;&lt;/tr&gt;&lt;tr data-ppte-id="ppte-190"&gt;&lt;td data-ppte-id="ppte-191"&gt;&lt;span class="row-num" data-ppte-id="ppte-192"&gt;04&lt;/span&gt;找到了修复方法&lt;/td&gt;&lt;td data-ppte-id="ppte-193"&gt;在独立分支完成修改并提交 PR&lt;/td&gt;&lt;td data-ppte-id="ppte-194"&gt;描述原因、改动与验证结果&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;div class="next-step" data-ppte-id="ppte-195"&gt;&lt;strong data-ppte-id="ppte-196"&gt;先缩小范围&lt;/strong&gt;&lt;span data-ppte-id="ppte-197"&gt;选一个问题 → 读贡献指南 → 讨论或提交 → 跟进反馈&lt;/span&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer class="folio" data-ppte-id="ppte-198"&gt;&lt;span data-ppte-id="ppte-199"&gt;贡献入口依据固定 README；行动清单为作者建议，不代表官方流程承诺&lt;/span&gt;&lt;span data-ppte-id="ppte-200"&gt;07 / 09&lt;/span&gt;&lt;/footer&gt;&lt;/section&gt;
&lt;section class="page" data-ppte-slide="ppte-201" data-ppte-id="ppte-201"&gt;&lt;header class="mast" data-ppte-id="ppte-202"&gt;&lt;span class="brand" data-ppte-id="ppte-203"&gt;CHERRY STUDIO&lt;/span&gt;&lt;span class="issue" data-ppte-id="ppte-204"&gt;持续 / 提交之后，协作仍在继续&lt;/span&gt;&lt;/header&gt;&lt;main class="statement" data-ppte-id="ppte-205"&gt;&lt;div data-ppte-id="ppte-206"&gt;&lt;p class="kicker" data-ppte-id="ppte-207"&gt;贡献不止于提交&lt;/p&gt;&lt;h2 data-ppte-id="ppte-208"&gt;留出空间，&lt;br data-ppte-id="ppte-209"&gt;接住反馈。&lt;/h2&gt;&lt;/div&gt;&lt;div data-ppte-id="ppte-210"&gt;&lt;p class="large-copy" data-ppte-id="ppte-211"&gt;把讨论看作共同理解问题的过程。&lt;/p&gt;&lt;div class="two-notes" style="margin-top: 30px; gap: 35px;" data-ppte-id="ppte-212"&gt;&lt;div class="note-block" data-ppte-id="ppte-213"&gt;&lt;h3 data-ppte-id="ppte-214"&gt;信息不够时&lt;/h3&gt;&lt;p data-ppte-id="ppte-215"&gt;补充复现步骤、例子或验证结果，帮助协作者缩小不确定性。&lt;/p&gt;&lt;/div&gt;&lt;div class="note-block" data-ppte-id="ppte-216"&gt;&lt;h3 data-ppte-id="ppte-217"&gt;意见不同时&lt;/h3&gt;&lt;p data-ppte-id="ppte-218"&gt;回到使用场景，解释取舍；必要时把大方案拆成小改动。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class="small-note" data-ppte-id="ppte-219"&gt;建议持续跟进，但不预设维护者的响应速度或合并结果。&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer class="folio" data-ppte-id="ppte-220"&gt;&lt;span data-ppte-id="ppte-221"&gt;作者参与建议 · 具体要求以项目贡献指南为准&lt;/span&gt;&lt;span data-ppte-id="ppte-222"&gt;08 / 09&lt;/span&gt;&lt;/footer&gt;&lt;/section&gt;
&lt;section class="page" data-ppte-slide="ppte-223" data-ppte-id="ppte-223"&gt;&lt;header class="mast" data-ppte-id="ppte-224"&gt;&lt;span class="brand" data-ppte-id="ppte-225"&gt;CHERRY STUDIO&lt;/span&gt;&lt;span class="issue" data-ppte-id="ppte-226"&gt;下一步 / 从一个问题开始&lt;/span&gt;&lt;/header&gt;&lt;main class="closing" data-ppte-id="ppte-227"&gt;&lt;p class="kicker" data-ppte-id="ppte-228"&gt;03 / 完成一次小贡献&lt;/p&gt;&lt;h2 data-ppte-id="ppte-229"&gt;选一个你在意的问题。&lt;br data-ppte-id="ppte-230"&gt;&lt;em data-ppte-id="ppte-231"&gt;让下一步，具体一点。&lt;/em&gt;&lt;/h2&gt;&lt;p class="body-copy" data-ppte-id="ppte-232"&gt;读一段指南，补一个例子，或写下一份清楚的反馈。&lt;br data-ppte-id="ppte-233"&gt;从自己能完成的范围开始，和社区一起向前。&lt;/p&gt;&lt;div class="sources" data-ppte-id="ppte-234"&gt;&lt;a href="https://github.com/CherryHQ/cherry-studio" data-ppte-id="ppte-235"&gt;项目仓库 ↗&lt;/a&gt;&lt;a href="https://github.com/CherryHQ/cherry-studio/blob/67ca175cc833ba6a286464343f64ec1e426d443a/CONTRIBUTING.md" data-ppte-id="ppte-236"&gt;贡献指南 ↗&lt;/a&gt;&lt;p data-ppte-id="ppte-237"&gt;本稿事实依据固定 README 67ca175。&lt;br data-ppte-id="ppte-238"&gt;不含实时统计；参与建议与概念图均为作者表达。&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer class="folio" data-ppte-id="ppte-239"&gt;&lt;span data-ppte-id="ppte-240"&gt;资料：固定 README 的 Introduction / Key Features / Contributing / Getting Started&lt;/span&gt;&lt;span data-ppte-id="ppte-241"&gt;09 / 09&lt;/span&gt;&lt;/footer&gt;&lt;/section&gt;
