n data-ppte-slide="ppte-27" data-ppte-id="ppte-27"&gt;&lt;header data-ppte-id="ppte-28"&gt;&lt;span data-ppte-id="ppte-29"&gt;02 / CHOICE&lt;/span&gt;&lt;span data-ppte-id="ppte-30"&gt;03 / 12&lt;/span&gt;&lt;/header&gt;&lt;main data-ppte-id="ppte-31"&gt;&lt;div class="rule" data-ppte-id="ppte-32"&gt;&lt;/div&gt;&lt;h1 data-ppte-id="cherry-title-3"&gt;云端与本地，共用入口&lt;/h1&gt;&lt;div data-ppte-id="cherry-body-3"&gt;&lt;p data-ppte-id="ppte-33"&gt;OpenAI / Gemini / Anthropic&lt;br data-ppte-id="ppte-34"&gt;Ollama / LM Studio&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer data-ppte-id="ppte-35"&gt;&lt;span data-ppte-id="ppte-36"&gt;README 同时列出云服务与本地模型支持。选择模型的自由，成为参与者的共同起点。&lt;/span&gt;&lt;svg aria-hidden="true" viewBox="0 0 110 40" data-ppte-id="ppte-37"&gt;&lt;path d="M0 20 H95 M80 5 L95 20 L80 35" data-ppte-id="ppte-38"&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/footer&gt;&lt;/section&gt;&lt;section data-ppte-slide="ppte-39" data-ppte-id="ppte-39"&gt;&lt;header data-ppte-id="ppte-40"&gt;&lt;span data-ppte-id="ppte-41"&gt;03 / WORKFLOW&lt;/span&gt;&lt;span data-ppte-id="ppte-42"&gt;04 / 12&lt;/span&gt;&lt;/header&gt;&lt;main data-ppte-id="ppte-43"&gt;&lt;div class="rule" data-ppte-id="ppte-44"&gt;&lt;/div&gt;&lt;h1 data-ppte-id="cherry-title-4"&gt;从提问到持续工作&lt;/h1&gt;&lt;div data-ppte-id="cherry-body-4"&gt;&lt;p data-ppte-id="ppte-45"&gt;助手 → 对话 → 文档 → 分享&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer data-ppte-id="ppte-46"&gt;&lt;span data-ppte-id="ppte-47"&gt;预设助手、自定义助手、多模型同时对话，为不同工作习惯提供入口。&lt;/span&gt;&lt;svg aria-hidden="true" viewBox="0 0 110 40" data-ppte-id="ppte-48"&gt;&lt;path d="M0 20 H95 M80 5 L95 20 L80 35" data-ppte-id="ppte-49"&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/footer&gt;&lt;/section&gt;&lt;section data-ppte-slide="ppte-50" data-ppte-id="ppte-50"&gt;&lt;header data-ppte-id="ppte-51"&gt;&lt;span data-ppte-id="ppte-52"&gt;04 / COMMUNITY&lt;/span&gt;&lt;span data-ppte-id="ppte-53"&gt;05 / 12&lt;/span&gt;&lt;/header&gt;&lt;main data-ppte-id="ppte-54"&gt;&lt;div class="rule" data-ppte-id="ppte-55"&gt;&lt;/div&gt;&lt;h1 data-ppte-id="cherry-title-5"&gt;贡献不只发生在代码里&lt;/h1&gt;&lt;div data-ppte-id="cherry-body-5"&gt;&lt;p data-ppte-id="ppte-56"&gt;修复问题 · 产品设计 · 文档维护&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer data-ppte-id="ppte-57"&gt;&lt;span data-ppte-id="ppte-58"&gt;问题管理、社区答疑与使用推广，同样是 README 明确欢迎的贡献方式。&lt;/span&gt;&lt;svg aria-hidden="true" viewBox="0 0 110 40" data-ppte-id="ppte-59"&gt;&lt;path d="M0 20 H95 M80 5 L95 20 L80 35" data-ppte-id="ppte-60"&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/footer&gt;&lt;/section&gt;&lt;section data-ppte-slide="ppte-61" data-ppte-id="ppte-61"&gt;&lt;header data-ppte-id="ppte-62"&gt;&lt;span data-ppte-id="ppte-63"&gt;05 / FIRST STEP&lt;/span&gt;&lt;span data-ppte-id="ppte-64"&gt;06 / 12&lt;/span&gt;&lt;/header&gt;&lt;main data-ppte-id="ppte-65"&gt;&lt;div class="rule" data-ppte-id="ppte-66"&gt;&lt;/div&gt;&lt;h1 data-ppte-id="cherry-title-6"&gt;先找到一个可完成的问题&lt;/h1&gt;&lt;div data-ppte-id="cherry-body-6"&gt;&lt;p data-ppte-id="ppte-67"&gt;Fork → 分支 → 提交 → Pull Request&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer data-ppte-id="ppte-68"&gt;&lt;span data-ppte-id="ppte-69"&gt;可以从 good first issue 开始；更详细的要求需阅读项目贡献指南。&lt;/span&gt;&lt;svg aria-hidden="true" viewBox="0 0 110 40" data-ppte-id="ppte-70"&gt;&lt;path d="M0 20 H95 M80 5 L95 20 L80 35" data-ppte-id="ppte-71"&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/footer&gt;&lt;/section&gt;&lt;section data-ppte-slide="ppte-72" data-ppte-id="ppte-72"&gt;&lt;header data-ppte-id="ppte-73"&gt;&lt;span data-ppte-id="ppte-74"&gt;06 / CO-CREATION&lt;/span&gt;&lt;span data-ppte-id="ppte-75"&gt;07 / 12&lt;/span&gt;&lt;/header&gt;&lt;main data-ppte-id="ppte-76"&gt;&lt;div class="rule" data-ppte-id="ppte-77"&gt;&lt;/div&gt;&lt;h1 data-ppte-id="cherry-title-7"&gt;让参与形成正向循环&lt;/h1&gt;&lt;div data-ppte-id="cherry-body-7"&gt;&lt;p data-ppte-id="ppte-78"&gt;开发者共创计划&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer data-ppte-id="ppte-79"&gt;&lt;span data-ppte-id="ppte-80"&gt;README 记录首期统计周期为 2025 年第三季度；这是历史材料中的计划，不能据此推断今天的执行情况。&lt;/span&gt;&lt;svg aria-hidden="true" viewBox="0 0 110 40" data-ppte-id="ppte-81"&gt;&lt;path d="M0 20 H95 M80 5 L95 20 L80 35" data-ppte-id="ppte-82"&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/footer&gt;&lt;/section&gt;&lt;section data-ppte-slide="ppte-83" data-ppte-id="ppte-83"&gt;&lt;header data-ppte-id="ppte-84"&gt;&lt;span data-ppte-id="ppte-85"&gt;07 / ECOSYSTEM&lt;/span&gt;&lt;span data-ppte-id="ppte-86"&gt;08 / 12&lt;/span&gt;&lt;/header&gt;&lt;main data-ppte-id="ppte-87"&gt;&lt;div class="rule" data-ppte-id="ppte-88"&gt;&lt;/div&gt;&lt;h1 data-ppte-id="cherry-title-8"&gt;界面也可以由社区塑造&lt;/h1&gt;&lt;div data-ppte-id="cherry-body-8"&gt;&lt;p data-ppte-id="ppte-89"&gt;主题画廊与社区主题&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer data-ppte-id="ppte-90"&gt;&lt;span data-ppte-id="ppte-91"&gt;主题项目提供不同视觉方向。开放参与的空间超出核心功能本身。&lt;/span&gt;&lt;svg aria-hidden="true" viewBox="0 0 110 40" data-ppte-id="ppte-92"&gt;&lt;path d="M0 20 H95 M80 5 L95 20 L80 35" data-ppte-id="ppte-93"&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/footer&gt;&lt;/section&gt;&lt;section data-ppte-slide="ppte-94" data-ppte-id="ppte-94"&gt;&lt;header data-ppte-id="ppte-95"&gt;&lt;span data-ppte-id="ppte-96"&gt;08 / BOUNDARY&lt;/span&gt;&lt;span data-ppte-id="ppte-97"&gt;09 / 12&lt;/span&gt;&lt;/header&gt;&lt;main data-ppte-id="ppte-98"&gt;&lt;div class="rule" data-ppte-id="ppte-99"&gt;&lt;/div&gt;&lt;h1 data-ppte-id="cherry-title-9"&gt;路线图，仍然是路线图&lt;/h1&gt;&lt;div data-ppte-id="cherry-body-9"&gt;&lt;p data-ppte-id="ppte-100"&gt;研究能力 · 知识管理 · 移动平台&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer data-ppte-id="ppte-101"&gt;&lt;span data-ppte-id="ppte-102"&gt;这些内容被来源放在 Roadmap 下。本稿不把它们当成已经交付的功能。&lt;/span&gt;&lt;svg aria-hidden="true" viewBox="0 0 110 40" data-ppte-id="ppte-103"&gt;&lt;path d="M0 20 H95 M80 5 L95 20 L80 35" data-ppte-id="ppte-104"&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/footer&gt;&lt;/section&gt;&lt;section data-ppte-slide="ppte-105" data-ppte-id="ppte-105"&gt;&lt;header data-ppte-id="ppte-106"&gt;&lt;span data-ppte-id="ppte-107"&gt;09 / EDITIONS&lt;/span&gt;&lt;span data-ppte-id="ppte-108"&gt;10 / 12&lt;/span&gt;&lt;/header&gt;&lt;main data-ppte-id="ppte-109"&gt;&lt;div class="rule" data-ppte-id="ppte-110"&gt;&lt;/div&gt;&lt;h1 data-ppte-id="cherry-title-10"&gt;社区与企业，面向不同场景&lt;/h1&gt;&lt;div data-ppte-id="cherry-body-10"&gt;&lt;p data-ppte-id="ppte-111"&gt;个人使用与协作治理&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer data-ppte-id="ppte-112"&gt;&lt;span data-ppte-id="ppte-113"&gt;社区版开放源代码；企业版强调模型管理、共享知识库、权限与私有部署。完整边界以固定材料为准。&lt;/span&gt;&lt;svg aria-hidden="true" viewBox="0 0 110 40" data-ppte-id="ppte-114"&gt;&lt;path d="M0 20 H95 M80 5 L95 20 L80 35" data-ppte-id="ppte-115"&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/footer&gt;&lt;/section&gt;&lt;section data-ppte-slide="ppte-116" data-ppte-id="ppte-116"&gt;&lt;header data-ppte-id="ppte-117"&gt;&lt;span data-ppte-id="ppte-118"&gt;10 / PRINCIPLE&lt;/span&gt;&lt;span data-ppte-id="ppte-119"&gt;11 / 12&lt;/span&gt;&lt;/header&gt;&lt;main data-ppte-id="ppte-120"&gt;&lt;div class="rule" data-ppte-id="ppte-121"&gt;&lt;/div&gt;&lt;h1 data-ppte-id="cherry-title-11"&gt;把真实需求变成下一次贡献&lt;/h1&gt;&lt;div data-ppte-id="cherry-body-11"&gt;&lt;p data-ppte-id="ppte-122"&gt;使用 → 反馈 → 讨论 → 改进&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer data-ppte-id="ppte-123"&gt;&lt;span data-ppte-id="ppte-124"&gt;先描述实际问题，再提出可复现的改进。此处是根据贡献入口形成的参与建议。&lt;/span&gt;&lt;svg aria-hidden="true" viewBox="0 0 110 40" data-ppte-id="ppte-125"&gt;&lt;path d="M0 20 H95 M80 5 L95 20 L80 35" data-ppte-id="ppte-126"&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/footer&gt;&lt;/section&gt;&lt;section data-ppte-slide="ppte-127" data-ppte-id="ppte-127"&gt;&lt;header data-ppte-id="ppte-128"&gt;&lt;span data-ppte-id="ppte-129"&gt;SOURCE / NEXT&lt;/span&gt;&lt;span data-ppte-id="ppte-130"&gt;12 / 12&lt;/span&gt;&lt;/header&gt;&lt;main data-ppte-id="ppte-131"&gt;&lt;div class="rule" data-ppte-id="ppte-132"&gt;&lt;/div&gt;&lt;h1 data-ppte-id="cherry-title-12"&gt;从一个具体贡献开始&lt;/h1&gt;&lt;div data-ppte-id="cherry-body-12"&gt;&lt;p data-ppte-id="ppte-133"&gt;阅读指南，参与讨论，提交改进。&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;&lt;footer data-ppte-id="ppte-134"&gt;&lt;span data-ppte-id="ppte-135"&gt;来源：CherryHQ/cherry-studio README，固定提交 67ca175cc833ba6a286464343f64ec1e426d443a。未采集增长数据，不作增长推断。&lt;/span&gt;&lt;svg aria-hidden="true" viewBox="0 0 110 40" data-ppte-id="ppte-136"&gt;&lt;path d="M0 20 H95 M80 5 L95 20 L80 35" data-ppte-id="ppte-137"&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/footer&gt;&lt;/section&gt;
