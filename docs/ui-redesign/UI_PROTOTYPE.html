<dialog id="help"><h2>让内容站在前面</h2><p>这是 PPTe 的界面设计原型。可体验阅读、编辑、纯净放映，以及插入、属性调整和撤销重做。它不是已接入产品的正式编辑器。</p><p><kbd>←</kbd> <kbd>→</kbd> 阅读与放映翻页　<kbd>Esc</kbd> 退出放映<br><kbd>B</kbd> 放映黑屏　<kbd>⌘ / Ctrl Z</kbd> 撤销<br>编辑时双击文字输入，拖动对象调整位置。</p><p>本原型仅保留当前会话的修改。“下载副本”会把当前内容写入一个新的原型 HTML；没有授权写回原文件，也不模拟“已自动保存”。PDF 演示仅打印当前页。</p><div class="dialog-actions"><button class="primary" id="help-close">知道了</button></div></dialog>

$('read-btn').onclick=()=>setMode('read');$('edit-btn').onclick=()=>setMode('edit');$('present-btn').onclick=startPresent;$('insert-btn').onclick=()=>{if(!$('menu').classList.contains('hidden'))closeMenu();else insertMenu()};$('more-btn').onclick=()=>{if(!$('menu').classList.contains('hidden'))return closeMenu();showMenu($('more-btn'),menuItem('download','下载原型副本','download')+menuItem('print','打印当前页 / PDF','print')+'<div class="menu-line"></div>'+menuItem('help','快捷键与原型说明','help'))};$('save-btn').onclick=download;$('help-btn').onclick=()=>$('help').showModal();$('help-close').onclick=()=>$('help').close();$('prev-btn').onclick=()=>go(current-1);$('next-btn').onclick=()=>go(current+1);$('thumbs').onclick=e=>{const b=e.target.closest('[data-page]');if(b)go(+b.dataset.page)};$('rail-toggle').onclick=()=>app.classList.toggle('rail-closed');$('read-rail-btn').onclick=()=>{if(mode==='edit')app.classList.toggle('rail-closed');else app.classList.toggle('rail-open')};$('page-style-btn').onclick=()=>{finishText();selected=null;panel=true;app.classList.add('inspecting');renderSlide();renderPanel()};$('undo-btn').onclick=()=>undo();$('redo-btn').onclick=()=>undo(true);$('zoom-in').onclick=()=>{zoom=Math.min(2,zoom+.15);fit()};$('zoom-out').onclick=()=>{zoom=Math.max(.5,zoom-.15);fit()};$('zoom-value').onclick=()=>{zoom=1;fit()};$('add-page').onclick=()=>{finishText();checkpoint();slides.splice(current+1,0,{bg:slides[current].bg,objects:[...base('新的一页',slides.length+1),txt('new'+(++uid),'给这一页一个重点',58,120,800,48,600)]});go(current+1)};
document.addEventListener('pointerdown',e=>{if(!$('menu').contains(e.target)&&!e.target.closest('#insert-btn,#more-btn'))closeMenu();if(editing&&!$('slide').contains(e.target))finishText()});
document.addEventListener('keydown',e=>{const input=e.target.closest('input,select,textarea,[contenteditable=true]');if(e.key==='Escape'){if($('help').open)return;if(closeMenu()){$('insert-btn').focus();return}if(mode==='present'){endPresent();return}if(editing){finishText();renderSlide();return}select(null);return}if(input||$('help').open)return;if(mode==='edit'&&(e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo(e.shiftKey);return}if((mode==='read'||mode==='present')&&['ArrowRight','PageDown',' ','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current+(['ArrowLeft','PageUp'].includes(e.key)?-1:1));return}if(mode==='present'&&e.key.toLowerCase()==='b'){app.classList.toggle('black');return}if(mode==='edit'&&e.key.toLowerCase()==='t'&&!e.metaKey&&!e.ctrlKey)insert('text');if(mode==='edit'&&selected&&['Delete','Backspace'].includes(e.key)){e.preventDefault();$('inspector').querySelector('[data-action=delete]')?.click()}if(mode==='edit'&&selected&&e.key.startsWith('Arrow')){e.preventDefault();checkpoint();const o=slides[current].objects.find(o=>o.id===selected),d=e.shiftKey?10:1;o.x+=e.key==='ArrowLeft'?-d:e.key==='ArrowRight'?d:0;o.y+=e.key==='ArrowUp'?-d:e.key==='ArrowDown'?d:0;render()}});
let idleTimer;$('workspace').addEventListener('pointermove',()=>{app.classList.remove('idle');clearTimeout(idleTimer);if(mode==='present')idleTimer=setTimeout(()=>app.classList.add('idle'),1800)});let touchX=null;$('workspace').addEventListener('touchstart',e=>{if(mode==='present')touchX=e.touches[0].clientX},{passive:true});$('workspace').addEventListener('touchend',e=>{if(mode==='present'&&touchX!==null){const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>50)go(current+(d<0?1:-1));touchX=null}},{passive:true});
setMode('read');
