&lt;section class="slide" data-ppte-slide="ppte-169" data-ppte-id="ppte-169"&gt;&lt;div class="head" data-ppte-id="ppte-170"&gt;&lt;span class="brand" data-ppte-id="ppte-171"&gt;CHERRY STUDIO&lt;/span&gt;&lt;span data-ppte-id="ppte-172"&gt;06 / 质量如何积累&lt;/span&gt;&lt;/div&gt;&lt;div class="split" data-ppte-id="ppte-173"&gt;&lt;div data-ppte-id="ppte-174"&gt;&lt;p class="eyebrow" data-ppte-id="ppte-175"&gt;功能之外，是日常体验&lt;/p&gt;&lt;h2 data-ppte-id="ppte-176"&gt;真正留下用户的，&lt;br data-ppte-id="ppte-177"&gt;是那些顺手的细节。&lt;/h2&gt;&lt;p class="lead space" data-ppte-id="ppte-178"&gt;功能可用，是起点。&lt;br data-ppte-id="ppte-179"&gt;稳定、清晰和可控，才构成信任。&lt;/p&gt;&lt;/div&gt;&lt;div data-ppte-id="ppte-180"&gt;&lt;div class="line-item" data-ppte-id="ppte-181"&gt;&lt;b data-ppte-id="ppte-182"&gt;01&lt;/b&gt;&lt;div data-ppte-id="ppte-183"&gt;&lt;h3 data-ppte-id="ppte-184"&gt;减少不必要的步骤&lt;/h3&gt;&lt;p data-ppte-id="ppte-185"&gt;让常用操作容易找到。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="line-item" data-ppte-id="ppte-186"&gt;&lt;b data-ppte-id="ppte-187"&gt;02&lt;/b&gt;&lt;div data-ppte-id="ppte-188"&gt;&lt;h3 data-ppte-id="ppte-189"&gt;把状态解释清楚&lt;/h3&gt;&lt;p data-ppte-id="ppte-190"&gt;让用户知道发生了什么。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="line-item" data-ppte-id="ppte-191"&gt;&lt;b data-ppte-id="ppte-192"&gt;03&lt;/b&gt;&lt;div data-ppte-id="ppte-193"&gt;&lt;h3 data-ppte-id="ppte-194"&gt;让反馈形成闭环&lt;/h3&gt;&lt;p data-ppte-id="ppte-195"&gt;实现之后，还要验证真实效果。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="foot" data-ppte-id="ppte-196"&gt;&lt;span data-ppte-id="ppte-197"&gt;产品观察与设计观点&lt;/span&gt;&lt;span data-ppte-id="ppte-198"&gt;07 / 10&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class="slide" data-ppte-slide="ppte-199" data-ppte-id="ppte-199"&gt;&lt;div class="head" data-ppte-id="ppte-200"&gt;&lt;span class="brand" data-ppte-id="ppte-201"&gt;CHERRY STUDIO&lt;/span&gt;&lt;span data-ppte-id="ppte-202"&gt;07 / 保持生长&lt;/span&gt;&lt;/div&gt;&lt;div class="statement" data-ppte-id="ppte-203"&gt;&lt;p class="eyebrow" data-ppte-id="ppte-204"&gt;持续演进，比一次完成更重要&lt;/p&gt;&lt;h2 data-ppte-id="ppte-205"&gt;把真实需求带进来，&lt;br data-ppte-id="ppte-206"&gt;把复杂程度控制住。&lt;/h2&gt;&lt;p class="lead" data-ppte-id="ppte-207"&gt;开放让更多想法进入产品，设计则帮助它们形成连贯的体验。&lt;/p&gt;&lt;div class="callout" data-ppte-id="ppte-208"&gt;明确方向 · 小步实现 · 真实验证 · 持续整理&lt;/div&gt;&lt;/div&gt;&lt;div class="foot" data-ppte-id="ppte-209"&gt;&lt;span data-ppte-id="ppte-210"&gt;面向未来的产品建议，非项目官方路线承诺&lt;/span&gt;&lt;span data-ppte-id="ppte-211"&gt;08 / 10&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
