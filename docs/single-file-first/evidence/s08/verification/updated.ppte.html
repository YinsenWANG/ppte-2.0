&lt;section class="slide dark" data-ppte-slide="ppte-3" data-ppte-id="ppte-3"&gt;&lt;div class="label" data-ppte-id="ppte-4"&gt;PPTe / 单文件验收稿&lt;/div&gt;&lt;h1 data-ppte-id="ppte-5"&gt;离线修改验证&lt;/h1&gt;&lt;p class="lead" data-ppte-id="ppte-8"&gt;一个 .ppte.html，承载阅读、编辑与放映。&lt;br data-ppte-id="ppte-9"&gt;读者无需安装 Node，也无需启动本地服务。&lt;/p&gt;&lt;div class="foot" data-ppte-id="ppte-10"&gt;&lt;span data-ppte-id="ppte-11"&gt;依据：single-file-first / PLAN · 2026-09-06&lt;/span&gt;&lt;span data-ppte-id="ppte-12"&gt;01 / 04&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class="slide" data-ppte-slide="ppte-13" data-ppte-id="ppte-13"&gt;&lt;div class="label" data-ppte-id="ppte-14"&gt;保存 / 按实际授权工作&lt;/div&gt;&lt;h2 data-ppte-id="ppte-15"&gt;修改属于你，&lt;br data-ppte-id="ppte-16"&gt;保存状态也应说清楚。&lt;/h2&gt;&lt;div class="columns" data-ppte-id="ppte-17"&gt;&lt;div class="line" data-ppte-id="ppte-18"&gt;&lt;h3 data-ppte-id="ppte-19"&gt;浏览器支持，且已授权&lt;/h3&gt;&lt;p data-ppte-id="ppte-20"&gt;关联当前文件后写回。&lt;br data-ppte-id="ppte-21"&gt;完成写入和读回确认，&lt;br data-ppte-id="ppte-22"&gt;才显示“已保存到文件”。&lt;/p&gt;&lt;/div&gt;&lt;div class="line" data-ppte-id="ppte-23"&gt;&lt;h3 data-ppte-id="ppte-24"&gt;不能覆盖原文件&lt;/h3&gt;&lt;p data-ppte-id="ppte-25"&gt;继续完整编辑，下载更新后的文件。&lt;br data-ppte-id="ppte-26"&gt;下载与草稿都不等于原文件已保存；&lt;br data-ppte-id="ppte-27"&gt;原生授权旅程仍待验收。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="foot" data-ppte-id="ppte-28"&gt;&lt;span data-ppte-id="ppte-29"&gt;首次打开不要求先授权；取消授权不丢当前修改。&lt;/span&gt;&lt;span data-ppte-id="ppte-30"&gt;02 / 04&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class="slide" data-ppte-slide="ppte-31" data-ppte-id="ppte-31"&gt;&lt;div class="label" data-ppte-id="ppte-32"&gt;设计与速度 / 给创作留空间&lt;/div&gt;&lt;h2 data-ppte-id="ppte-33"&gt;提醒轻一点，&lt;br data-ppte-id="ppte-34"&gt;证据实一点。&lt;/h2&gt;&lt;div class="columns" data-ppte-id="ppte-35"&gt;&lt;div class="line" data-ppte-id="ppte-36"&gt;&lt;h3 data-ppte-id="ppte-37"&gt;自由设计，先理解内容&lt;/h3&gt;&lt;p data-ppte-id="ppte-38"&gt;用留白、层级和节奏表达重点。&lt;br data-ppte-id="ppte-39"&gt;有图片时先实际查看，再选图排版；&lt;br data-ppte-id="ppte-40"&gt;保留主体、关键文字与可调整裁切。&lt;/p&gt;&lt;/div&gt;&lt;div class="line" data-ppte-id="ppte-41"&gt;&lt;h3 data-ppte-id="ppte-42"&gt;先测量，再减少重复工作&lt;/h3&gt;&lt;p data-ppte-id="ppte-43"&gt;已减少重复缩略图与草稿处理。&lt;br data-ppte-id="ppte-44"&gt;现有开发机输入和翻页指标未达标；&lt;br data-ppte-id="ppte-45"&gt;端到端时间与 tokens 仍待受控采集。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="foot" data-ppte-id="ppte-46"&gt;&lt;span data-ppte-id="ppte-47"&gt;无固定配方或美学评分门禁；工具耗时不代替模型总耗时。&lt;/span&gt;&lt;span data-ppte-id="ppte-48"&gt;03 / 04&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class="slide" data-ppte-slide="ppte-49" data-ppte-id="ppte-49"&gt;&lt;div class="label" data-ppte-id="ppte-50"&gt;邀请验收 / 当前为部分完成&lt;/div&gt;&lt;h2 data-ppte-id="ppte-51"&gt;从这个文件开始。&lt;/h2&gt;&lt;div class="steps" data-ppte-id="ppte-52"&gt;&lt;strong data-ppte-id="ppte-53"&gt;01&lt;/strong&gt;&lt;p data-ppte-id="ppte-54"&gt;进入编辑，修改一句话，尝试撤销与重做。&lt;/p&gt;&lt;strong data-ppte-id="ppte-55"&gt;02&lt;/strong&gt;&lt;p data-ppte-id="ppte-56"&gt;下载更新文件，关闭后重开，确认修改仍在。&lt;/p&gt;&lt;strong data-ppte-id="ppte-57"&gt;03&lt;/strong&gt;&lt;p data-ppte-id="ppte-58"&gt;点击放映，翻页，再用 Esc 返回阅读。&lt;/p&gt;&lt;/div&gt;&lt;p class="small" style="margin-top: 35px;" data-ppte-id="ppte-59"&gt;待验收：Safari、原生文件授权、系统输入法与打印、无 Node 目标机、&lt;br data-ppte-id="ppte-60"&gt;九对同模型比较、负责人及两名目标用户评价、真实低性能设备。&lt;/p&gt;&lt;div class="foot" data-ppte-id="ppte-61"&gt;&lt;span data-ppte-id="ppte-62"&gt;本稿是新 Skill 生成样本，不是九对盲评或全部通过声明。&lt;/span&gt;&lt;span data-ppte-id="ppte-63"&gt;04 / 04&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
